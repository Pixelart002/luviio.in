name: Restore Payment Service
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'chore: restore canonical payment service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical payment service
        run: |
          git checkout a47fb81b3be85f70ea63d874763fb55c43b95ac2 -- app/domains/payments/service.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/domains/payments/service.py
          git diff --cached --quiet || git commit -m 'chore: restore canonical payment service'
          git push
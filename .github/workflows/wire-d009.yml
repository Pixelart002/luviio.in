name: Wire D-009

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wire durable checkout attempts
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('app/domains/payments/repository.py')
          text = repo.read_text()
          marker = '''    async def create_pending_order_with_reservation(\n'''
          insert = '''    async def create_checkout_payment_attempt(\n        self, customer_id: str, idempotency_key: str, amount_paise: int, currency: str = "inr"\n    ) -> str:\n        admin_sb = await get_async_admin_supabase()\n        provider = get_current_provider_key()\n        try:\n            res = await admin_sb.rpc(\n                "create_checkout_payment_attempt",\n                {\n                    "p_customer_id": customer_id,\n                    "p_idempotency_key": idempotency_key,\n                    "p_provider": provider,\n                    "p_amount_paise": amount_paise,\n                    "p_currency": currency,\n                },\n            ).execute()\n            data = getattr(res, "data", None)\n            if not data:\n                raise RuntimeError("Checkout payment attempt RPC returned no id")\n            row = data[0] if isinstance(data, list) else data\n            return str(row.get("id") if isinstance(row, dict) else row)\n        except Exception as exc:\n            logger.error("DB Error creating checkout payment attempt: %s", exc, exc_info=True)\n            raise RuntimeError("Unable to create durable checkout payment attempt") from exc\n\n    async def update_checkout_payment_attempt(\n        self, attempt_id: str, provider_payment_id: Optional[str] = None,\n        status: Optional[str] = None, last_error: Optional[str] = None\n    ) -> None:\n        admin_sb = await get_async_admin_supabase()\n        try:\n            await admin_sb.rpc(\n                "update_checkout_payment_attempt",\n                {\n                    "p_id": attempt_id,\n                    "p_provider_payment_id": provider_payment_id,\n                    "p_status": status,\n                    "p_last_error": last_error,\n                },\n            ).execute()\n        except Exception as exc:\n            logger.error("DB Error updating checkout payment attempt %s: %s", attempt_id, exc, exc_info=True)\n            raise RuntimeError("Unable to update durable checkout payment attempt") from exc\n\n    async def list_stale_checkout_payment_attempts(self, cutoff_iso: str) -> List[Dict[str, Any]]:\n        admin_sb = await get_async_admin_supabase()\n        try:\n            res = await (\n                admin_sb.table("checkout_payment_attempts")\n                .select("id, customer_id, idempotency_key, payment_provider, provider_payment_id, amount_paise, currency, status, created_at, expires_at")\n                .lt("expires_at", cutoff_iso)\n                .in_("status", ["provider_pending", "provider_created", "cancel_requested", "orphan_risk"])\n                .order("expires_at")\n                .limit(100)\n                .execute()\n            )\n            return getattr(res, "data", None) or []\n        except Exception as exc:\n            logger.error("DB Error listing stale checkout payment attempts: %s", exc, exc_info=True)\n            raise RuntimeError("Unable to load stale checkout payment attempts") from exc\n\n'''
          if marker not in text:
              raise SystemExit('repository insertion marker missing')
          repo.write_text(text.replace(marker, insert + marker, 1))

          service = Path('app/domains/payments/service.py')
          text = service.read_text()
          old = '''        try:\n            intent = await run_in_threadpool(self.provider.create_payment_intent, amount_paise, "inr", "AOT_PENDING", user_id, f"aot_pi_{clean_idem_key}")\n        except Exception as exc:\n            logger.error("[PAYMENT ERROR] Initial Stripe Intent creation failed: %s", exc, exc_info=True)\n            raise HTTPException(status_code=status.HTTP_502_BAD_GATEWAY, detail=PaymentSecurityMessages.PAYMENT_FAILED) from exc\n\n        order_number = self._generate_clean_order_number()\n'''
          new = '''        try:\n            checkout_attempt_id = await self.repo.create_checkout_payment_attempt(\n                user_id, clean_idem_key, amount_paise, "inr"\n            )\n            await self.repo.update_checkout_payment_attempt(\n                checkout_attempt_id, status="provider_pending"\n            )\n        except Exception as exc:\n            logger.error("[PAYMENT ERROR] Durable checkout-attempt creation failed: %s", exc, exc_info=True)\n            raise HTTPException(status_code=status.HTTP_503_SERVICE_UNAVAILABLE, detail=PaymentSecurityMessages.PAYMENT_FAILED) from exc\n\n        try:\n            intent = await run_in_threadpool(self.provider.create_payment_intent, amount_paise, "inr", "AOT_PENDING", user_id, f"aot_pi_{clean_idem_key}")\n        except Exception as exc:\n            logger.error("[PAYMENT ERROR] Initial Stripe Intent creation failed: %s", exc, exc_info=True)\n            try:\n                await self.repo.update_checkout_payment_attempt(\n                    checkout_attempt_id, status="cancelled", last_error=str(exc)[:1000]\n                )\n            except Exception:\n                logger.critical("[PAYMENT ORPHAN RISK] Could not close durable checkout attempt %s", checkout_attempt_id, exc_info=True)\n            raise HTTPException(status_code=status.HTTP_502_BAD_GATEWAY, detail=PaymentSecurityMessages.PAYMENT_FAILED) from exc\n\n        await self.repo.update_checkout_payment_attempt(\n            checkout_attempt_id, provider_payment_id=intent["id"], status="provider_created"\n        )\n\n        order_number = self._generate_clean_order_number()\n'''
          if old not in text:
              raise SystemExit('service provider-create marker missing')
          text = text.replace(old, new, 1)

          old = '''            logger.error("[CRITICAL DB ERROR] Atomic Reservation Failed: %s", exc, exc_info=True)\n            # Compensation boundary: Stripe created the provider object before the\n'''
          new = '''            logger.error("[CRITICAL DB ERROR] Atomic Reservation Failed: %s", exc, exc_info=True)\n            try:\n                await self.repo.update_checkout_payment_attempt(\n                    checkout_attempt_id, status="cancel_requested", last_error=str(exc)[:1000]\n                )\n            except Exception:\n                logger.critical("[PAYMENT ORPHAN RISK] Could not mark checkout attempt %s cancel_requested", checkout_attempt_id, exc_info=True)\n            # Compensation boundary: Stripe created the provider object before the\n'''
          if old not in text:
              raise SystemExit('service compensation marker missing')
          text = text.replace(old, new, 1)

          old = '''                logger.warning(\n                    "[PAYMENT COMPENSATION] Cancelled Stripe PaymentIntent %s after order persistence failure",\n                    intent["id"],\n                )\n'''
          new = '''                logger.warning(\n                    "[PAYMENT COMPENSATION] Cancelled Stripe PaymentIntent %s after order persistence failure",\n                    intent["id"],\n                )\n                await self.repo.update_checkout_payment_attempt(\n                    checkout_attempt_id, status="cancelled", last_error=str(exc)[:1000]\n                )\n'''
          if old not in text:
              raise SystemExit('service successful-cancel marker missing')
          text = text.replace(old, new, 1)

          old = '''                logger.critical(\n                    "[PAYMENT ORPHAN RISK] Failed to cancel Stripe PaymentIntent %s after order persistence failure: %s",\n                    intent["id"],\n                    cancel_exc,\n                    exc_info=True,\n                )\n'''
          new = '''                logger.critical(\n                    "[PAYMENT ORPHAN RISK] Failed to cancel Stripe PaymentIntent %s after order persistence failure: %s",\n                    intent["id"],\n                    cancel_exc,\n                    exc_info=True,\n                )\n                try:\n                    await self.repo.update_checkout_payment_attempt(\n                        checkout_attempt_id, status="orphan_risk", last_error=str(cancel_exc)[:1000]\n                    )\n                except Exception:\n                    logger.critical("[PAYMENT ORPHAN RISK] Durable checkout attempt update also failed for %s", checkout_attempt_id, exc_info=True)\n'''
          if old not in text:
              raise SystemExit('service failed-cancel marker missing')
          text = text.replace(old, new, 1)

          old = '''        await run_in_threadpool(self.provider.update_intent_metadata, intent["id"], {"order_id": pending_order["id"], "user_id": user_id})\n        await self.repo.record_payment_attempt(pending_order["id"], user_id, intent["id"], amount_paise / 100, status="requires_payment_method", ip_address=client_ip, user_agent=user_agent)\n'''
          new = '''        await self.repo.update_checkout_payment_attempt(\n            checkout_attempt_id, provider_payment_id=intent["id"], status="order_created"\n        )\n        await run_in_threadpool(self.provider.update_intent_metadata, intent["id"], {"order_id": pending_order["id"], "user_id": user_id})\n        await self.repo.record_payment_attempt(pending_order["id"], user_id, intent["id"], amount_paise / 100, status="requires_payment_method", ip_address=client_ip, user_agent=user_agent)\n'''
          if old not in text:
              raise SystemExit('service order-created marker missing')
          service.write_text(text.replace(old, new, 1))

          cron = Path('app/cron/tasks/order_tasks.py')
          text = cron.read_text()
          marker = '''@cron_task(minutes=15)\nasync def cleanup_abandoned_orders() -> None:\n'''
          insert = '''@cron_task(minutes=15)\nasync def reconcile_checkout_payment_attempts() -> None:\n    """Reconcile durable pre-provider checkout attempts that outlived their TTL."""\n    from datetime import datetime, timezone\n\n    logger.info("[CRON] Running checkout-payment-attempt reconciliation...")\n    payments = __import__("app.domains.payments.repository", fromlist=["AsyncPaymentRepository"]).AsyncPaymentRepository()\n    cutoff = datetime.now(timezone.utc).isoformat()\n    attempts = await payments.list_stale_checkout_payment_attempts(cutoff)\n\n    for attempt in attempts:\n        attempt_id = attempt["id"]\n        provider_key = str(attempt.get("payment_provider") or "").strip().lower()\n        provider_payment_id = str(attempt.get("provider_payment_id") or "").strip()\n        try:\n            if not provider_key:\n                await payments.update_checkout_payment_attempt(attempt_id, status="cancelled", last_error="missing_provider")\n                continue\n\n            provider = get_payment_provider(provider_key)\n            with payment_provider_context(provider_key):\n                if provider_payment_id:\n                    order = await payments.get_order_by_payment_intent(provider_payment_id)\n                    if order:\n                        await payments.update_checkout_payment_attempt(\n                            attempt_id, status="order_created", last_error=None\n                        )\n                        continue\n\n                    intent = await run_in_threadpool(provider.retrieve_intent, provider_payment_id)\n                    provider_status = str(intent.get("status") or "").lower()\n\n                    if provider_status == "succeeded":\n                        refunded = await run_in_threadpool(provider.process_refund, provider_payment_id)\n                        if refunded:\n                            await payments.update_checkout_payment_attempt(\n                                attempt_id, status="completed", last_error="orphan_success_refunded"\n                            )\n                        else:\n                            await payments.update_checkout_payment_attempt(\n                                attempt_id, status="orphan_risk", last_error="orphan_success_refund_failed"\n                            )\n                    elif provider_status not in {"canceled", "cancelled"}:\n                        await payments.update_checkout_payment_attempt(\n                            attempt_id, status="cancel_requested", last_error="expired_reconciliation"\n                        )\n                        try:\n                            await run_in_threadpool(provider.cancel_intent, provider_payment_id)\n                            await payments.update_checkout_payment_attempt(\n                                attempt_id, status="cancelled", last_error="expired_reconciliation"\n                            )\n                        except Exception as cancel_exc:\n                            await payments.update_checkout_payment_attempt(\n                                attempt_id, status="orphan_risk", last_error=str(cancel_exc)[:1000]\n                            )\n                    else:\n                        await payments.update_checkout_payment_attempt(\n                            attempt_id, status="cancelled", last_error="provider_already_cancelled"\n                        )\n                else:\n                    await payments.update_checkout_payment_attempt(\n                        attempt_id, status="cancelled", last_error="provider_not_created_before_expiry"\n                    )\n        except Exception as exc:\n            logger.error(\n                "[CRON] Checkout payment attempt %s reconciliation failed: %s",\n                attempt_id, exc, exc_info=True,\n            )\n\n    logger.info("[CRON] Checkout-payment-attempt reconciliation complete. Checked %d attempt(s).", len(attempts))\n\n\n@cron_task(minutes=15)\nasync def cleanup_abandoned_orders() -> None:\n'''
          if marker not in text:
              raise SystemExit('cron insertion marker missing')
          cron.write_text(text.replace(marker, insert, 1))

          ledger = Path('context/DEFECT_LEDGER.md')
          text = ledger.read_text()
          old = '''### D-009 — Stripe intent may exist without a persisted pending order\n**Status:** partially mitigated; durable orphan reconciliation remains open.\n**Fixed:** when the Stripe PaymentIntent is created but atomic order/reservation persistence fails, the service now attempts provider-side cancellation before returning the checkout error. If cancellation fails, a high-severity orphan-risk log is emitted.\n**Remaining:** add a durable pre-provider checkout-attempt record and reconciliation sweep for provider intents that have no matching Luviio order.\n'''
          new = '''### D-009 — Stripe intent may exist without a persisted pending order\n**Status:** mitigated with durable compensation + reconciliation.\n**Fixed:** a service-role-only durable checkout attempt is created before provider creation and tracks provider/order lifecycle. Provider creation failures close the attempt. Atomic order-persistence failures trigger provider cancellation; cancellation failures become `orphan_risk`.\n**Reconciliation:** a 15-minute sweep checks expired durable attempts; cancelled/nonexistent provider objects are closed, cancellable provider objects are cancelled, and succeeded provider objects without a Luviio order are refunded and marked completed when refund succeeds.\n'''
          if old not in text:
              raise SystemExit('ledger D-009 block missing')
          ledger.write_text(text.replace(old, new, 1))
          PY

      - name: Add targeted compensation test
        run: |
          cat >> tests/test_payment_races.py <<'PY'

          @pytest.mark.asyncio
          async def test_create_intent_persistence_failure_compensates_provider_intent(monkeypatch):
              service, provider = build_service(monkeypatch)
              service.repo.get_order_by_idempotency_key = AsyncMock(return_value=None)
              service.repo.get_cart_items_for_checkout = AsyncMock(return_value=[{
                  "product_id": "prod-1", "quantity": 1, "price_snapshot": 100,
                  "products": {"name": "Item", "compare_price": 100, "stock": 10, "hsn_code": "1234", "gst_percentage": 18, "is_active": True},
              }])
              service.repo.get_pricing_config = AsyncMock(return_value={})
              service.repo.get_shipping_address = AsyncMock(return_value={
                  "id": "addr-1", "full_name": "User", "phone": "9999999999", "email": "user@example.com",
                  "line1": "1 Main St", "city": "Delhi", "state": "Delhi", "postal_code": "110001", "country": "IN",
              })
              service.repo.create_checkout_payment_attempt = AsyncMock(return_value="attempt-1")
              service.repo.update_checkout_payment_attempt = AsyncMock()
              service.repo.create_pending_order_with_reservation = AsyncMock(side_effect=RuntimeError("db down"))
              service.repo.get_order_by_idempotency_key = AsyncMock(side_effect=[None, None])
              provider.create_payment_intent.return_value = {"id": "pi_orphan", "client_secret": "secret", "status": "requires_payment_method"}
              provider.cancel_intent.return_value = {"id": "pi_orphan", "status": "canceled"}

              with pytest.raises(HTTPException) as error:
                  await service.create_intent("user-1", "127.0.0.1", "11111111-1111-4111-8111-111111111111", "addr-1")

              assert error.value.status_code == 409
              provider.cancel_intent.assert_called_once_with("pi_orphan")
              service.repo.update_checkout_payment_attempt.assert_any_await(
                  "attempt-1", status="orphan_risk", last_error="db down"
              )
          PY

      - name: Remove workflow after patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/wire-d009.yml')
          me = p.read_text()
          p.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/domains/payments/repository.py app/domains/payments/service.py app/cron/tasks/order_tasks.py tests/test_payment_races.py context/DEFECT_LEDGER.md .github/workflows/wire-d009.yml
          git commit -m "fix payments: wire durable checkout attempt reconciliation"
          git push
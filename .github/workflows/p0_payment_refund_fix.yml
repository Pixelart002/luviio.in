name: P0 payment refund fix
on:
  push:
    branches: [p0-payment-refund-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch refund failure semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/domains/payments/service.py')
          s = p.read_text()
          replacements = [
          ('''        if result == "ORDER_ALREADY_CANCELLED":\n            try:\n                await run_in_threadpool(self.provider.process_refund, pi_id)\n            except Exception as refund_exc:\n                logger.error("[PAYMENT] Auto-refund FAILED for orphaned success %s: %s", pi_id, refund_exc, exc_info=True)\n            raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail=PaymentSecurityMessages.ORDER_CANCELLED_AUTO_REFUNDED)''', '''        if result == "ORDER_ALREADY_CANCELLED":\n            try:\n                await run_in_threadpool(self.provider.process_refund, pi_id)\n            except Exception as refund_exc:\n                logger.error("[PAYMENT] Auto-refund FAILED for orphaned success %s: %s", pi_id, refund_exc, exc_info=True)\n                raise HTTPException(status_code=status.HTTP_503_SERVICE_UNAVAILABLE, detail=PaymentSecurityMessages.ORDER_CANCELLED_REFUND_PENDING) from refund_exc\n            raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail=PaymentSecurityMessages.ORDER_CANCELLED_AUTO_REFUNDED)'''),
          ('''                if result == "ORDER_ALREADY_CANCELLED":\n                    try:\n                        await run_in_threadpool(self.provider.process_refund, pi_id)\n                    except Exception as refund_error:\n                        logger.error("[PAYMENT RETRY] Refund failed for cancelled order %s", order_id[:8], exc_info=True)\n                    raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail=PaymentSecurityMessages.ORDER_CANCELLED_AUTO_REFUNDED)''', '''                if result == "ORDER_ALREADY_CANCELLED":\n                    try:\n                        await run_in_threadpool(self.provider.process_refund, pi_id)\n                    except Exception as refund_error:\n                        logger.error("[PAYMENT RETRY] Refund failed for cancelled order %s", order_id[:8], exc_info=True)\n                        raise HTTPException(status_code=status.HTTP_503_SERVICE_UNAVAILABLE, detail=PaymentSecurityMessages.ORDER_CANCELLED_REFUND_PENDING) from refund_error\n                    raise HTTPException(status_code=status.HTTP_409_CONFLICT, detail=PaymentSecurityMessages.ORDER_CANCELLED_AUTO_REFUNDED)'''),
          ('''                    if result == "ORDER_ALREADY_CANCELLED":\n                        try:\n                            await run_in_threadpool(self.provider.process_refund, pi_id)\n                        except Exception:\n                            logger.error("[WEBHOOK] Auto-refund FAILED for orphaned success %s", pi_id, exc_info=True)\n                    elif result == "SETTLED":''', '''                    if result == "ORDER_ALREADY_CANCELLED":\n                        try:\n                            await run_in_threadpool(self.provider.process_refund, pi_id)\n                        except Exception as refund_exc:\n                            logger.error("[WEBHOOK] Auto-refund FAILED for orphaned success %s", pi_id, exc_info=True)\n                            raise RuntimeError("Automatic refund failed; webhook must remain retryable") from refund_exc\n                    elif result == "SETTLED":'''),
          ]
          for old, new in replacements:
              assert old in s
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add regression tests
        run: |
          cat >> tests/test_payment_races.py <<'PY'


@pytest.mark.asyncio
async def test_confirm_cancelled_order_refund_failure_is_pending(monkeypatch):
    service, provider = build_service(monkeypatch)
    service.repo.get_order_by_id = AsyncMock(return_value={"id":"order-1","customer_id":"user-1","status":"pending"})
    service.repo.settle_order_transaction = AsyncMock(return_value="ORDER_ALREADY_CANCELLED")
    provider.retrieve_intent.return_value = {"id":"pi_fail","status":"succeeded","amount":1000,"payment_method_types":["card"],"metadata":{"order_id":"order-1"}}
    provider.process_refund.side_effect = RuntimeError("refund unavailable")
    with pytest.raises(HTTPException) as error:
        await service.confirm_payment("user-1", "127.0.0.1", "pi_fail", "user@example.com")
    assert error.value.status_code == 503
    assert error.value.detail == PaymentSecurityMessages.ORDER_CANCELLED_REFUND_PENDING


@pytest.mark.asyncio
async def test_retry_cancelled_order_refund_failure_is_pending(monkeypatch):
    service, provider = build_service(monkeypatch)
    service.repo.get_order_by_id = AsyncMock(return_value={"id":"order-1","customer_id":"user-1","status":"pending","total_amount":10})
    service.repo.settle_order_transaction = AsyncMock(return_value="ORDER_ALREADY_CANCELLED")
    provider.retrieve_intent.return_value = {"id":"pi_fail","status":"succeeded","amount":1000,"payment_method_types":["card"]}
    provider.process_refund.side_effect = RuntimeError("refund unavailable")
    with pytest.raises(HTTPException) as error:
        await service.retry_payment("user-1", "order-1")
    assert error.value.status_code == 503
    assert error.value.detail == PaymentSecurityMessages.ORDER_CANCELLED_REFUND_PENDING
PY
          python -m py_compile app/domains/payments/service.py
          grep -q 'ORDER_CANCELLED_REFUND_PENDING' app/domains/payments/service.py
          pytest -q tests/test_payment_races.py
      - name: Commit and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/domains/payments/service.py tests/test_payment_races.py
          git rm .github/workflows/p0_payment_refund_fix.yml
          git commit -m 'fix: harden payment refund failure semantics'
          git push
{% macro render_cart_drawer() %}
<div id="cartOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] opacity-0 pointer-events-none transition-opacity duration-500"></div>

<div id="cartDrawer" class="fixed top-0 right-0 h-[100dvh] w-full md:w-[450px] bg-luviio-panel border-l border-white/5 z-[110] transform translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col shadow-2xl">
    
    <div class="h-20 px-8 flex items-center justify-between border-b border-white/5 shrink-0">
        <h2 class="font-serif text-xl text-white tracking-wide flex items-center gap-3">
            <i class="ri-shopping-bag-3-line text-luviio-gold"></i> Your Cart
        </h2>
        <button id="closeCartBtn" class="text-gray-500 hover:text-luviio-gold sys-transition outline-none">
            <i class="ri-close-line text-2xl"></i>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto px-8 py-8 cart-scrollbar flex flex-col gap-6" id="cartItemsContainer">
        
        <div class="flex gap-5 group">
            <div class="w-20 h-24 bg-[#111] rounded-lg overflow-hidden shrink-0 border border-white/5 relative">
                <img src="https://images.unsplash.com/photo-1595515106969-1ce29566ff1c?auto=format&fit=crop&w=300" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 sys-transition" alt="Product">
            </div>
            <div class="flex flex-col justify-center flex-1 py-1">
                <div class="flex justify-between items-start mb-1">
                    <h4 class="text-sm font-serif text-white">Aura Gold Faucet</h4>
                    <button class="text-gray-600 hover:text-red-500 sys-transition outline-none"><i class="ri-delete-bin-line"></i></button>
                </div>
                <p class="text-[9px] uppercase tracking-widest text-gray-500 mb-3">Brass / Matte</p>
                <div class="flex justify-between items-center mt-auto">
                    <div class="flex items-center gap-3 border border-white/10 rounded-sm px-2 py-1 bg-black/50">
                        <button class="text-gray-500 hover:text-white outline-none"><i class="ri-subtract-line text-xs"></i></button>
                        <span class="text-[10px] font-sans w-4 text-center text-white">1</span>
                        <button class="text-gray-500 hover:text-white outline-none"><i class="ri-add-line text-xs"></i></button>
                    </div>
                    <p class="text-sm font-sans font-medium text-luviio-gold">₹12,500</p>
                </div>
            </div>
        </div>

        </div>

    <div class="p-8 border-t border-white/5 bg-black/40 shrink-0">
        <div class="flex justify-between items-center mb-6">
            <span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Subtotal</span>
            <span class="text-2xl font-serif text-white">₹12,500</span>
        </div>
        <p class="text-[9px] text-gray-500 mb-6 tracking-wide uppercase">Shipping & taxes calculated at checkout.</p>
        <a href="/checkout" class="w-full bg-luviio-gold text-black py-4 rounded-sm text-[10px] uppercase tracking-[0.2em] font-bold hover:bg-white sys-transition flex justify-center items-center gap-3 hover-target block text-center">
            Proceed to Checkout <i class="ri-arrow-right-line text-lg"></i>
        </a>
    </div>
</div>

<style>
    .cart-scrollbar::-webkit-scrollbar { width: 3px; }
    .cart-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .cart-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    .cart-scrollbar::-webkit-scrollbar-thumb:hover { background: #C5A059; }
</style>

<script>
    // Making it Global so any page can call it
    window.openCart = function() {
        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        cartOverlay.classList.remove('opacity-0', 'pointer-events-none');
        cartDrawer.classList.remove('translate-x-full');
        document.body.style.overflow = 'hidden'; // Stop background scrolling
    }

    window.closeCart = function() {
        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        cartOverlay.classList.add('opacity-0', 'pointer-events-none');
        cartDrawer.classList.add('translate-x-full');
        document.body.style.overflow = ''; // Restore background scrolling
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('closeCartBtn').addEventListener('click', window.closeCart);
        document.getElementById('cartOverlay').addEventListener('click', window.closeCart);
    });
</script>
{% endmacro %}

{% macro render_navbar(user) %}
<header class="fixed w-full top-0 z-50 transition-transform duration-700" id="mainHeader">
  <div class="bg-luviio-stone/80 backdrop-blur-xl flex justify-between items-center px-6 md:px-10 py-4 relative z-10 border-b border-luviio-sand/50">
    <div class="flex items-center gap-3 hover-target cursor-pointer group">
      <div class="w-6 h-6 md:w-8 md:h-8 flex items-center justify-center overflow-hidden">
        <img src="/api/static/images/logo.png" alt="Logo" class="w-full h-full object-contain sys-transition group-hover:scale-110">
      </div>
      <h1 class="text-sm md:text-lg font-serif font-medium tracking-[0.2em] text-luviio-charcoal uppercase leading-none mt-1">LUVIIO</h1>
    </div>
    
    <div class="flex items-center gap-6 md:gap-10">
      <div class="hidden md:flex items-center gap-5 border-r border-luviio-sand/80 pr-8">
        {% if user %}
        <a href="/dashboard" class="text-[10px] font-sans font-bold uppercase tracking-[0.2em] bg-luviio-charcoal text-white px-6 py-2.5 rounded-full hover:bg-luviio-gold sys-transition">Dashboard</a>
        {% else %}
        <a href="/login" class="text-[10px] font-sans font-bold uppercase tracking-[0.2em] text-luviio-charcoal hover:text-luviio-gold sys-transition">Sign In</a>
        <div class="w-[1px] h-4 bg-luviio-sand mx-2"></div>
        <a href="/partner" class="text-[10px] font-sans font-bold uppercase tracking-[0.2em] bg-luviio-charcoal text-white px-6 py-2.5 rounded-full hover:bg-luviio-gold sys-transition">Partner Portal</a>
        {% endif %}
      </div>
      <button id="menuTrigger" class="text-2xl text-luviio-charcoal sys-transition hover:text-luviio-gold flex gap-2 items-center">
        <span class="text-[10px] uppercase tracking-[0.2em] font-sans font-bold hidden md:block mt-1">Menu</span>
        <i class="ri-menu-3-line"></i>
      </button>
    </div>
  </div>
</header>
{% endmacro %}

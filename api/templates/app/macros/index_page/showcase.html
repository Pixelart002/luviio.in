{% macro render_showcase() %}
<section id="showcaseWrapper" class="bg-luviio-stone text-luviio-charcoal overflow-hidden relative w-full pt-10">
  <div id="showcaseContainer" class="h-[100dvh] flex flex-col justify-center relative z-10">
    <div class="px-6 md:px-16 mb-10 flex justify-between items-end w-full max-w-[1600px] mx-auto">
      <h2 class="text-4xl md:text-7xl font-serif italic uppercase tracking-widest overflow-hidden">
        <span id="showcaseTitle" class="inline-block transform translate-y-full text-luviio-charcoal">Showcase.</span>
      </h2>
    </div>
    
    <div class="flex gap-8 md:gap-16 px-6 md:px-16 items-center w-max gpu-target" id="horizontalTrack">
      <div class="showcase-card flex-shrink-0 w-[85vw] md:w-[450px] lg:w-[550px] h-[55vh] md:h-[65vh] bg-black rounded-[2rem] p-8 flex flex-col justify-between overflow-hidden group hover-target relative shadow-2xl">
        <img src="https://images.unsplash.com/photo-1620626011761-996317b8d101?auto=format&fit=crop&q=80&w=1000" decoding="async" class="showcase-img absolute inset-0 w-full h-full object-cover object-center opacity-70 scale-[1.3] sys-transition group-hover:scale-[1.35] group-hover:opacity-100" alt="Minimalist Space">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent pointer-events-none"></div>
        <span class="bg-luviio-gold text-white px-4 py-2 rounded-full font-sans font-bold text-[9px] uppercase tracking-[0.3em] w-max z-10">2026 Edition</span>
        <h3 class="text-3xl md:text-5xl font-serif z-10 translate-y-4 sys-transition group-hover:translate-y-0 text-white">Modern Ceramics</h3>
      </div>
      <div class="showcase-card flex-shrink-0 w-[85vw] md:w-[450px] lg:w-[550px] h-[55vh] md:h-[65vh] bg-black rounded-[2rem] p-8 flex flex-col justify-between overflow-hidden group hover-target relative shadow-2xl">
        <img src="https://images.unsplash.com/photo-1595515106969-1ce29566ff1c?auto=format&fit=crop&q=80&w=1000" decoding="async" class="showcase-img absolute inset-0 w-full h-full object-cover object-center opacity-70 scale-[1.3] sys-transition group-hover:scale-[1.35] group-hover:opacity-100" alt="Gold Faucet">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent pointer-events-none"></div>
        <span class="border border-white/40 backdrop-blur-md text-white px-4 py-2 rounded-full font-sans font-bold text-[9px] uppercase tracking-[0.3em] w-max z-10">Premium</span>
        <h3 class="text-3xl md:text-5xl font-serif z-10 translate-y-4 sys-transition group-hover:translate-y-0 text-white">Brass Textures</h3>
      </div>
    </div>
  </div>
</section>
{% endmacro %}

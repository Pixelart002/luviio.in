{% macro render_splash() %}
<div id="splashScreen" class="fixed inset-0 z-[999] bg-luviio-charcoal flex flex-col items-center justify-center text-white origin-bottom">
  <div class="overflow-hidden mb-8">
    <h1 id="splashLogo" class="text-4xl md:text-6xl font-serif tracking-[0.2em] flex items-center gap-4 opacity-0 scale-110" style="filter: blur(10px);">
      <img src="/api/static/images/logo.png" alt="Luviio Logo" class="w-12 h-12 md:w-16 md:h-16 object-contain invert" fetchpriority="high"> LUVIIO
    </h1>
  </div>
  <div class="w-48 h-[1px] bg-white/10 overflow-hidden relative">
    <div id="splashProgress" class="absolute top-0 left-0 h-full bg-luviio-gold w-0 shadow-[0_0_10px_#C5A059]"></div>
  </div>
</div>
{% endmacro %}

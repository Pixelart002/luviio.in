{% macro render_hero() %}
<div class="relative w-full z-20">
  <section class="h-[100dvh] pt-32 pb-8 px-4 md:px-10 relative flex flex-col items-center overflow-hidden">
    <div class="flex-shrink-0 text-center w-full max-w-6xl mx-auto z-10 pt-2 md:pt-4">
      <h2 class="text-[11vw] leading-[1.05] sm:text-[8vw] md:text-[6.5rem] font-serif tracking-tight text-luviio-charcoal">
        <div class="reveal-mask"><span class="reveal-text hero-text">Premium Ceramic</span></div><br>
        <div class="reveal-mask"><span class="reveal-text hero-text text-marble italic pr-4">Bathware.</span></div>
      </h2>
    </div>
    <div class="flex-1 w-full max-w-[1500px] mt-8 md:mt-12 rounded-t-[10rem] md:rounded-t-[30rem] rounded-b-xl md:rounded-b-3xl overflow-hidden relative hero-image-wrapper opacity-0" style="clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);">
      <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=2000" id="heroImage" class="absolute inset-0 w-full h-full object-cover object-center scale-[1.5] blur-[20px] gpu-target cinematic-vignette" alt="Luxury Washbasin" fetchpriority="high">
      <div class="absolute inset-0 bg-gradient-to-t from-luviio-charcoal/80 via-transparent to-black/20"></div>
      <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center text-white/80 sys-transition hover:text-white">
        <div class="w-8 h-12 rounded-full border border-white/40 flex justify-center items-start pt-2 backdrop-blur-sm mb-4">
          <div class="w-1 h-2 bg-luviio-gold rounded-full animate-bounce"></div>
        </div>
        <span class="font-sans text-[8px] tracking-[0.4em] uppercase font-bold">Discover</span>
      </div>
    </div>
  </section>
</div>
{% endmacro %}

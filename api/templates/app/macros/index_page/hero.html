{% macro render_hero() %}
<section class="h-[100dvh] pt-32 pb-8 px-4 md:px-10 relative flex flex-col items-center overflow-hidden">
  <div class="flex-shrink-0 text-center w-full max-w-6xl mx-auto z-10 pt-2 md:pt-4">
    <h2 class="text-[11vw] leading-[1.05] sm:text-[8vw] md:text-[6.5rem] font-serif tracking-tight text-luviio-charcoal">
      <div class="reveal-mask" style="clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); display: inline-block;">
        <span class="reveal-text hero-text inline-block" style="transform: translateY(120%);">Premium Ceramic</span>
      </div><br>
      <div class="reveal-mask" style="clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); display: inline-block;">
        <span class="reveal-text hero-text inline-block italic text-gray-500" style="transform: translateY(120%);">Bathware.</span>
      </div>
    </h2>
  </div>
  <div class="flex-1 w-full max-w-[1500px] mt-8 md:mt-12 rounded-t-[10rem] md:rounded-t-[30rem] rounded-b-xl overflow-hidden relative hero-image-wrapper opacity-0" style="clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);">
    <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=2000" id="heroImage" class="absolute inset-0 w-full h-full object-cover scale-[1.5] blur-[20px]" alt="Hero Image">
    <div class="absolute inset-0 bg-gradient-to-t from-luviio-charcoal/80 to-transparent"></div>
  </div>
</section>
{% endmacro %}

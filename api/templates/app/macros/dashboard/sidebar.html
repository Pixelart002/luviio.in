{% macro render_sidebar(user) %}
<div id="sidebarOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden" onclick="toggleSidebar()"></div>

<aside id="mainSidebar" class="fixed md:relative top-0 left-0 z-50 h-full w-64 flex flex-col border-r border-luviio-border bg-[#050505] transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
  
  <button onclick="toggleSidebar()" class="md:hidden absolute top-5 right-5 text-gray-500 hover:text-white sys-transition">
    <i class="ri-close-line text-2xl"></i>
  </button>
  
  <div class="h-20 md:h-24 flex items-center px-8 border-b border-luviio-border shrink-0">
    <a href="/" class="flex items-center gap-3 group">
      <img src="/api/static/images/logo.png" alt="Logo" class="w-6 h-6 object-contain invert sys-transition group-hover:scale-110">
      <h1 class="text-sm font-serif tracking-[0.2em] uppercase leading-none mt-1 text-white">LUVIIO</h1>
    </a>
  </div>
  
  <nav class="flex-1 py-8 flex flex-col gap-2 overflow-y-auto hide-scrollbar">
    <a href="/dashboard" class="nav-item active px-8 py-3 flex items-center gap-4 text-xs uppercase tracking-widest font-bold sys-transition hover:text-luviio-gold group">
      <i class="ri-dashboard-line text-lg group-hover:scale-110 sys-transition"></i> Overview
    </a>
    <a href="#" class="nav-item px-8 py-3 flex items-center gap-4 text-xs uppercase tracking-widest font-bold text-gray-500 sys-transition hover:text-luviio-gold group">
      <i class="ri-shopping-bag-3-line text-lg group-hover:scale-110 sys-transition"></i> Orders
    </a>
    <a href="/" class="nav-item px-8 py-3 flex items-center gap-4 text-xs uppercase tracking-widest font-bold text-gray-500 sys-transition hover:text-luviio-gold group">
      <i class="ri-layout-grid-line text-lg group-hover:scale-110 sys-transition"></i> Catalog
    </a>
    <a href="#" class="nav-item px-8 py-3 flex items-center gap-4 text-xs uppercase tracking-widest font-bold text-gray-500 sys-transition hover:text-luviio-gold group">
      <i class="ri-settings-3-line text-lg group-hover:scale-110 sys-transition"></i> Settings
    </a>
  </nav>
  
  <div class="p-6 md:p-8 border-t border-luviio-border shrink-0">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-luviio-gold/20 flex items-center justify-center text-luviio-gold font-serif text-lg">
        {{ user.name[0] | upper if user.name else 'U' }}
      </div>
      <div class="overflow-hidden">
        <p class="text-xs font-bold text-white truncate w-32">{{ user.name | default("Premium User") }}</p>
        <p class="text-[9px] text-gray-500 uppercase tracking-widest truncate w-32">{{ user.email }}</p>
      </div>
    </div>
    <a href="/logout" class="flex items-center gap-3 text-xs uppercase tracking-widest font-bold text-red-500/80 hover:text-red-500 sys-transition">
      <i class="ri-logout-box-r-line text-lg"></i> Sign Out
    </a>
  </div>
</aside>
{% endmacro %}

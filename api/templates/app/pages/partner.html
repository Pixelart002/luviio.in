<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Portal - LUVIIO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --luviio-gold: #C5A059;
            --bg-black: #0a0a0a;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .font-serif { font-family: 'Playfair Display', serif; }

        /* Input Styles */
        .input-group { position: relative; margin-bottom: 2rem; width: 100%; }
        .input-group input {
            width: 100%; padding: 10px 0; color: #fff; font-size: 16px;
            background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.15);
            outline: none; transition: border-color 0.3s ease; border-radius: 0;
            appearance: none;
        }
        .input-group input:focus { border-bottom: 1px solid var(--luviio-gold); }
        .input-group label {
            position: absolute; top: 10px; left: 0; font-size: 0.65rem; color: rgba(255,255,255,0.5);
            pointer-events: none; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1) all;
            text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600;
        }
        .input-group input:focus ~ label,
        .input-group input:valid ~ label { top: -16px; font-size: 0.55rem; color: var(--luviio-gold); opacity: 1; }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none; background: transparent; margin: 0; width: 14px; height: 14px;
            border: 1px solid rgba(255,255,255,0.4); border-radius: 1px; display: grid; place-content: center; cursor: pointer;
        }
        .custom-checkbox::before {
            content: ""; width: 8px; height: 8px; transform: scale(0); transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--luviio-gold); background-color: var(--luviio-gold);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked::before { transform: scale(1); }
        
        .auth-anim { opacity: 0; transform: translateY(20px); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

    <main class="fixed inset-0 flex flex-col lg:flex-row bg-[#0a0a0a] overflow-hidden">
        
        <section class="hidden lg:block lg:w-1/2 relative h-full bg-black shrink-0 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=80&w=1200" 
                 id="authImage" 
                 class="absolute inset-0 w-full h-full object-cover opacity-60 scale-110" 
                 alt="Luxury Interior">
            
            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-transparent"></div>
            
            <div class="absolute bottom-16 left-16 z-10 auth-anim">
                <h2 class="text-5xl font-serif mb-4 leading-tight">Trade & <br><span class="italic text-[#C5A059]">Retail.</span></h2>
                <p class="text-xs text-gray-400 tracking-[0.2em] max-w-xs leading-relaxed uppercase">
                    Join our exclusive network of architects and developers. Elevate projects with LUVIIO curation.
                </p>
            </div>
        </section>

        <section class="w-full lg:w-1/2 h-full flex flex-col items-center justify-center p-6 sm:p-12 lg:p-24 overflow-y-auto relative">
            
            <div class="w-full flex justify-start mb-8 lg:absolute lg:top-12 lg:left-12 lg:mb-0 auth-anim">
                <a href="/" class="text-gray-500 hover:text-white transition-colors flex items-center gap-2 text-[10px] uppercase tracking-widest font-bold">
                    <i class="ri-arrow-left-line text-lg"></i> Home
                </a>
            </div>

            <div class="w-full max-w-[340px] m-auto py-12">
                
                <div class="flex justify-center mb-8 auth-anim">
                    <div class="w-14 h-14 flex items-center justify-center p-2 border border-[#C5A059]/30 rounded-sm bg-[#C5A059]/5">
                        <img src="/api/static/images/logo.png" alt="Logo" class="w-full h-full object-contain invert opacity-90">
                    </div>
                </div>
                
                <div class="text-center mb-10 auth-anim">
                    <h1 class="text-3xl font-serif mb-2 tracking-wide text-white">Trade Partnership</h1>
                    <p class="text-[9px] text-[#C5A059] uppercase tracking-[0.25em] font-bold">Official Application Portal</p>
                </div>

                <form action="/" method="GET" class="w-full space-y-2">
                    <div class="input-group auth-anim">
                        <input type="text" name="company_name" id="company_name" required autocomplete="organization">
                        <label for="company_name">Company Name</label>
                    </div>
                    
                    <div class="input-group auth-anim">
                        <input type="text" name="business_id" id="business_id" required>
                        <label for="business_id">Business ID / GSTIN</label>
                    </div>
                    
                    <div class="input-group auth-anim">
                        <input type="email" name="email" id="email" required autocomplete="email">
                        <label for="email">Business Email</label>
                    </div>
                    
                    <div class="input-group auth-anim mb-6">
                        <input type="password" name="password" id="password" required autocomplete="new-password">
                        <label for="password">Create Password</label>
                    </div>
                    
                    <div class="flex items-center py-4 auth-anim w-full">
                        <label class="flex items-start gap-3 cursor-pointer group">
                            <input type="checkbox" class="custom-checkbox mt-[2px]" required>
                            <span class="text-[9px] text-gray-500 uppercase tracking-widest font-bold leading-tight group-hover:text-gray-300 transition-colors">
                                Verify trade credentials
                            </span>
                        </label>
                    </div>
                    
                    <button type="submit" class="w-full py-4 bg-transparent border border-[#C5A059] text-[#C5A059] rounded-sm font-bold uppercase tracking-[0.2em] text-[10px] hover:bg-[#C5A059] hover:text-black transition-all duration-500 auth-anim active:scale-[0.98]">
                        Submit Application
                    </button>
                </form>

                <div class="mt-10 text-center auth-anim flex flex-col items-center gap-6">
                    <p class="text-[10px] text-gray-500 tracking-widest uppercase">
                        Already a partner? <a href="/login" class="text-white font-bold hover:text-[#C5A059] transition-colors border-b border-gray-700 pb-[2px] ml-1">Sign In</a>
                    </p>
                    
                    <div class="flex items-center justify-center gap-4 w-full opacity-20">
                        <div class="h-[1px] flex-1 bg-white"></div>
                        <p class="text-[8px] text-white uppercase tracking-widest font-bold">OR</p>
                        <div class="h-[1px] flex-1 bg-white"></div>
                    </div>
                    
                    <p class="text-[10px] text-gray-500 tracking-widest uppercase">
                        Looking to shop? <a href="/" class="text-[#C5A059] font-bold hover:text-white transition-colors border-b border-[#C5A059]/30 pb-[2px] ml-1">Browse Catalog</a>
                    </p>
                </div>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Hero Image Slow Zoom
            const heroImg = document.querySelector("#authImage");
            if(heroImg) { 
                gsap.to(heroImg, { scale: 1, duration: 15, ease: "power1.inOut" }); 
            }

            // Staggered Reveal
            gsap.to(".auth-anim", {
                y: 0, 
                opacity: 1, 
                duration: 1, 
                stagger: 0.1, 
                ease: "power3.out", 
                delay: 0.2
            });
        });
    </script>
</body>
</html>

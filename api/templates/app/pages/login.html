{% extends "app/base.html" %}

{% from "app/macros/auth_page/login_layout.html" import render_login %}

{% block title %}Sign In - LUVIIO{% endblock %}

{% block extra_css %}
<style>
    /* Safely Overriding base.html body for this specific page */
    body {
        background-color: #0a0a0a !important;
        color: #ffffff !important;
        overflow: hidden !important;
        height: 100dvh !important;
    }
    #mainContent {
        width: 100%;
        height: 100%;
        display: flex;
    }

    /* Tumhara Original CSS */
    h1, h2, h3, h4, h5, h6 { font-family: 'Playfair Display', serif; }

    .input-group { position: relative; margin-bottom: 2.5rem; }
    .input-group input {
        width: 100%; padding: 8px 0; font-size: 0.875rem; color: #fff;
        background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.15);
        outline: none; transition: border-color 0.3s;
    }
    .input-group input:focus { border-bottom: 1px solid #C5A059; }
    .input-group label {
        position: absolute; top: 8px; left: 0; font-size: 0.65rem; color: rgba(255,255,255,0.6);
        pointer-events: none; transition: 0.3s ease all; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600;
    }
    .input-group input:focus ~ label,
    .input-group input:valid ~ label {
        top: -16px; font-size: 0.55rem; color: #C5A059;
    }

    .gpu-target { transform: translateZ(0); will-change: transform; }
    
    .custom-checkbox {
        appearance: none;
        background-color: transparent;
        margin: 0;
        font: inherit;
        color: currentColor;
        width: 12px;
        height: 12px;
        border: 1px solid rgba(255,255,255,0.4);
        border-radius: 1px;
        display: grid;
        place-content: center;
    }
    .custom-checkbox::before {
        content: "";
        width: 8px;
        height: 8px;
        transform: scale(0);
        transition: 120ms transform ease-in-out;
        box-shadow: inset 1em 1em #C5A059;
        background-color: #C5A059;
        transform-origin: center;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    .custom-checkbox:checked::before {
        transform: scale(1);
    }
    .custom-checkbox:checked {
        border-color: #C5A059;
    }
</style>
{% endblock %}

{% block content %}
    {{ render_login() }}
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Base.html hides mainContent by default for splash, we show it instantly for Login page
        document.getElementById('mainContent').classList.remove('hidden');
        gsap.to("#mainContent", { opacity: 1, duration: 0.5 });

        gsap.config({ force3D: true });

        // Tumhari Original Animations
        gsap.to("#authImage", {
            scale: 1,
            duration: 10,
            ease: "power1.out"
        });

        gsap.to(".auth-anim", {
            y: 0,
            opacity: 1,
            duration: 1,
            stagger: 0.08,
            ease: "power3.out",
            delay: 0.2
        });
    });
</script>
{% endblock %}

{% from "app/macros/shared/toast.html" import render_toast %}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}LUVIIO - Premium Bathware{% endblock %}</title>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <link rel="preload" as="image" href="/api/static/images/logo.png">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=2000">
    
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luviio: {
                            stone: '#F5F5F0',
                            charcoal: '#111111',
                            gold: '#C5A059',
                            sand: '#E5E5DF',
                            panel: '#121212'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        signature: ['Great Vibes', 'cursive'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 🔥 THE ULTIMATE SCROLL FIX */
        html,
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: #F5F5F0;
            color: #111111;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important; /* Prevents mobile bounce */
            margin: 0;
            padding: 0;
        }
        
        html.lenis,
        html.lenis body {
            height: auto;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden !important;
        }
        
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }
        
        @media (min-width: 768px) {
            body, a, button, input { cursor: none; }
            #cursor { position: fixed; top: 0; left: 0; width: 16px; height: 16px; background: #C5A059; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; transform: translate(-50%, -50%); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s; will-change: transform; }
            #cursor.hover-active { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); mix-blend-mode: normal; border: 1px solid rgba(255, 255, 255, 0.3); }
        }
        
        .text-marble { background-image: url('https://images.unsplash.com/photo-1558055620-1e5b8823f666?q=80&w=1200&auto=format&fit=crop'); background-size: cover; background-position: center; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; display: inline-block; filter: contrast(1.2) brightness(0.9); }
        .cinematic-vignette { box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5); }
        .glass-overlay { backdrop-filter: blur(0px); transition: backdrop-filter 0.8s ease-in-out; }
        .glass-overlay.active { backdrop-filter: blur(16px); }
        .glass-menu { background: rgba(245, 245, 240, 0.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-left: 1px solid rgba(255, 255, 255, 0.4); }
        .stacked-section { position: sticky; top: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; transform-origin: top center; }
        .reveal-mask { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); display: inline-block; padding-bottom: 0.1em; }
        .reveal-text { transform: translateY(120%) rotateZ(2deg); display: inline-block; transform-origin: top left; }
        .clip-mask { overflow: hidden; display: inline-block; padding-bottom: 0.1em; }
        .clip-text { display: inline-block; transform: translateY(100%); }
        .gpu-target { transform: translateZ(0); backface-visibility: hidden; perspective: 1000px; }
        
        @keyframes float-subtle { 0%, 100% { transform: translateY(0px) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
        .anim-float { animation: float-subtle 8s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .sys-transition { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .pricing-glow::before { content: ''; position: absolute; inset: -2px; background: linear-gradient(45deg, #C5A059, transparent, #C5A059); z-index: -1; filter: blur(15px); opacity: 0; transition: opacity 0.5s ease; }
        .pricing-card:hover .pricing-glow::before { opacity: 0.6; }
        
        .swiper-pagination-bullet { background-color: rgba(0, 0, 0, 0.3) !important; }
        .swiper-pagination-bullet-active { background-color: #C5A059 !important; }
        .dark-swiper .swiper-pagination-bullet { background-color: rgba(255, 255, 255, 0.3) !important; }
        .dark-swiper .swiper-pagination-bullet-active { background-color: #C5A059 !important; }
        
      
    </style>
      {% block extra_css %}{% endblock %}
</head>

<body class="w-full max-w-full overflow-x-hidden {% block body_class %}relative bg-luviio-stone text-luviio-charcoal{% endblock %}">
    
    <div class="relative w-full overflow-hidden" style="clip-path: inset(0);">
        
        <div id="cursor" class="hidden md:block"></div>
        
        {% block content %}
        {% endblock %}
        
    </div> 

    
    {{ render_toast() }}
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
   
   
   
   
   
   
   
    
    {% block extra_scripts %}
    {% endblock %}
</body>

</html>

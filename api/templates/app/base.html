{% from "app/macros/shared/toast.html" import render_toast %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}LUVIIO - Premium Bathware{% endblock %}</title>
    
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { luviio: { stone: '#F5F5F0', charcoal: '#111111', gold: '#C5A059', sand: '#E5E5DF', panel: '#121212' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], signature: ['Great Vibes', 'cursive'] }
                }
            }
        }
    </script>
    
    <style>
        html, body { -webkit-font-smoothing: antialiased; background-color: #F5F5F0; color: #111111; overflow-x: hidden; }
        #cursor { position: fixed; top: 0; left: 0; width: 16px; height: 16px; background: #C5A059; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; transform: translate(-50%, -50%); transition: width 0.4s, height 0.4s; }
        #cursor.hover-active { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); mix-blend-mode: normal; border: 1px solid rgba(255, 255, 255, 0.3); }
        .sys-transition { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body class="relative bg-luviio-stone">
    <div id="cursor" class="hidden md:block"></div>

    <main id="mainContent" class="opacity-0 hidden">
        {% block content %}{% endblock %}
    </main>

    {{ render_toast() }}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>

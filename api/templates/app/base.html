{% from "app/macros/shared/toast.html" import render_toast %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}LUVIIO - Premium Bathware{% endblock %}</title>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <link rel="preload" as="image" href="/api/static/images/logo.png">
    
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luviio: { stone: '#F5F5F0', charcoal: '#111111', gold: '#C5A059', sand: '#E5E5DF', panel: '#121212' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        signature: ['Great Vibes', 'cursive'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* ==========================================
           🛠️ STRICT RESPONSIVE UTILITY CLASSES
           ========================================== */
        :root {
            /* Fallback, will be strictly calculated by JS UIEngine */
            --dvh: 1vh; 
        }

        /* 1. The Ultimate Viewport Lock */
        html, body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #F5F5F0;
            color: #111111;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            margin: 0;
            padding: 0;
        }

        /* 2. Strict Full Height Wrapper (Fixes Mobile Address Bar Bug) */
        .strict-wrap {
            width: 100%;
            min-height: calc(var(--dvh, 1vh) * 100);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 3. Strict Centering (For Auth/Empty Pages) */
        .strict-center {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: calc(var(--dvh, 1vh) * 100);
        }

        /* 4. Strict Safe Container (Maintains padding safely on all devices) */
        .strict-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: max(1.5rem, env(safe-area-inset-left));
            padding-right: max(1.5rem, env(safe-area-inset-right));
        }

        /* Lenis Smooth Scroll Setup */
        html.lenis, html.lenis body { height: auto; width: 100%; max-width: 100%; overflow-x: hidden !important; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }

        /* Cursor */
        @media (min-width: 1024px) {
            body, a, button, input { cursor: none; }
            #cursor { position: fixed; top: 0; left: 0; width: 14px; height: 14px; background: #C5A059; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s, background-color 0.3s; will-change: transform; }
            #cursor.hover-active { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); mix-blend-mode: normal; border: 1px solid rgba(255, 255, 255, 0.3); }
        }
        
        /* Disable hover effects on touch devices to prevent sticky hover states */
        @media (hover: none) {
            .hover-active { display: none !important; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>

<body class="w-full max-w-full overflow-x-hidden {% block body_class %}bg-luviio-stone text-luviio-charcoal{% endblock %}">
    
    <div class="strict-wrap" style="clip-path: inset(0);">
        
        <div id="cursor" class="hidden lg:block"></div>
        
        {% block content %}
        {% endblock %}
        
    </div> 

    {{ render_toast() }}
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
   
   <script>
        // ==========================================
        // 🛠️ UIEngine: STRICT RESPONSIVE UTILITY
        // ==========================================
        const UIEngine = {
            lenis: null,
            cursor: null,

            init() {
                this.setDynamicViewport();
                this.handleResize();
                this.initLenis();
                this.initCursor();
                this.preventMobileScrollBounce();
            },

            // Fixes the 100vh issue on mobile browsers (Safari/Chrome Address bar)
            setDynamicViewport() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--dvh', `${vh}px`);
            },

            // Highly optimized resize listener to prevent layout thrashing
            handleResize() {
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        this.setDynamicViewport();
                    }, 150);
                });
            },

            // Stop unwanted rubber-band effect on iOS
            preventMobileScrollBounce() {
                document.body.addEventListener('touchmove', function(e) {
                    if (e.target.closest('.strict-wrap') && !e.target.closest('[data-scrollable]')) {
                        // Let specific elements scroll if they have data-scrollable, else lock horizontal
                    }
                }, { passive: true });
            },

            initLenis() {
                this.lenis = new Lenis({
                    lerp: 0.1,
                    smoothWheel: true,
                    wheelMultiplier: 0.9
                });
                window.lenis = this.lenis; // Expose globally for things like Cart Drawer

                const raf = (time) => {
                    this.lenis.raf(time);
                    requestAnimationFrame(raf);
                };
                requestAnimationFrame(raf);
            },

            initCursor() {
                this.cursor = document.getElementById('cursor');
                // Only run custom cursor logic if device supports hover (Desktop)
                if (this.cursor && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
                    document.addEventListener('mousemove', (e) => {
                        gsap.to(this.cursor, { x: e.clientX, y: e.clientY, duration: 0.15, ease: "power2.out" });
                    });

                    // Auto-attach hover states to buttons/links
                    document.querySelectorAll('a, button, input').forEach(el => {
                        el.addEventListener('mouseenter', () => this.cursor.classList.add('hover-active'));
                        el.addEventListener('mouseleave', () => this.cursor.classList.remove('hover-active'));
                    });
                }
            }
        };

        // Fire up the Engine!
        document.addEventListener("DOMContentLoaded", () => {
            UIEngine.init();
        });
   </script>
    
    {% block extra_scripts %}
    {% endblock %}
</body>
</html>

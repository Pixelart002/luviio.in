<header class="fixed w-full top-0 z-50 transition-transform duration-700 bg-[#F5F5F0]/80 backdrop-blur-xl border-b border-[#E5E5DF]/50" id="mainHeader">
  <div class="flex justify-between items-center px-6 md:px-10 py-4 relative z-10">
    <a href="/" class="flex items-center gap-3">
      <img src="{{ ui_config.branding.logo_url }}" alt="Logo" class="w-8 h-8 object-contain">
      <h1 class="text-sm md:text-lg font-serif tracking-[0.2em] uppercase">{{ ui_config.branding.name }}</h1>
    </a>
    <div class="flex items-center gap-6">
      <div class="hidden md:flex items-center gap-5 border-r border-[#E5E5DF] pr-8">
        <a href="/login" class="text-[10px] font-sans font-bold uppercase tracking-[0.2em] hover:text-[#C5A059] sys-transition">Sign In</a>
        
        {% if ui_config.feature_flags.enable_partner_portal %}
        <div class="w-[1px] h-4 bg-[#E5E5DF] mx-2"></div>
        <a href="/partner" class="text-[10px] font-sans font-bold uppercase tracking-[0.2em] bg-[#111] text-white px-6 py-2.5 rounded-full hover:bg-[#C5A059] sys-transition">Partner Portal</a>
        {% endif %}
      </div>
      <button id="menuTrigger" class="text-2xl outline-none hover:text-[#C5A059] sys-transition flex items-center gap-2">
        <span class="text-[10px] uppercase tracking-[0.2em] font-sans font-bold hidden md:block">Menu</span>
        <i class="ri-menu-3-line"></i>
      </button>
    </div>
  </div>
</header>

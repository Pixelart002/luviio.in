<div id="drawerOverlay" class="fixed inset-0 bg-[#111111]/40 glass-overlay z-[60] opacity-0 pointer-events-none transition-opacity duration-700"></div>

<div id="drawerContent" class="hidden fixed top-0 right-0 h-full w-full md:w-[450px] bg-[#F5F5F0]/95 backdrop-blur-xl border-l border-[#E5E5DF]/50 z-[70] transform translate-x-full transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col shadow-2xl">
  <div class="flex justify-between items-center px-10 py-8 z-20 relative bg-transparent border-b border-[#E5E5DF]/50">
    <button id="profileTrigger" class="w-10 h-10 flex items-center justify-start text-[#111111] sys-transition hover:scale-110 hover:text-[#C5A059] outline-none bg-transparent" title="Account"><i class="ri-user-3-line text-xl"></i></button>
    <button id="closeDrawer" class="w-10 h-10 flex items-center justify-end text-[#111111] sys-transition hover:scale-110 hover:text-[#C5A059] outline-none bg-transparent"><i class="ri-close-line text-2xl"></i></button>
  </div>
  
  <div class="relative flex-grow overflow-hidden z-10 flex flex-col">
    <div id="menuState" class="absolute inset-0 px-10 pb-12 pt-8 flex flex-col justify-between transition-all duration-500 transform translate-x-0 opacity-100 ease-[cubic-bezier(0.16,1,0.3,1)]">
      <div class="flex flex-col gap-6 mt-4">
        <div class="overflow-hidden pb-1"><a href="/collection" class="inline-block transform translate-y-full clip-text drawer-link text-4xl md:text-5xl font-serif italic text-gray-400 sys-transition hover:text-[#111111] hover:translate-x-4">Collection.</a></div>
        <div class="overflow-hidden pb-1"><a href="/gallery" class="inline-block transform translate-y-full clip-text drawer-link text-4xl md:text-5xl font-serif italic text-gray-400 sys-transition hover:text-[#111111] hover:translate-x-4">Gallery.</a></div>
        <div class="overflow-hidden pb-1"><a href="/story" class="inline-block transform translate-y-full clip-text drawer-link text-4xl md:text-5xl font-serif italic text-gray-400 sys-transition hover:text-[#111111] hover:translate-x-4">Our Story.</a></div>
      </div>
      
      <div class="mt-auto pt-8 border-t border-[#E5E5DF]/50">
        <div class="flex flex-col gap-3 mb-8">
          {% if user %}
          <div class="overflow-hidden w-full"><a href="/dashboard" class="inline-block transform translate-y-full clip-text drawer-btn w-full text-center py-4 rounded-xl bg-[#111] text-white font-sans text-[10px] font-bold tracking-widest uppercase hover:bg-[#C5A059] sys-transition">Dashboard</a></div>
          <div class="overflow-hidden w-full"><a href="/logout" class="inline-block transform translate-y-full clip-text drawer-btn w-full text-center py-4 rounded-xl border border-red-900/50 text-red-800 font-sans text-[10px] font-bold tracking-widest uppercase hover:bg-red-900 hover:text-white sys-transition">Logout</a></div>
          {% else %}
          <div class="flex gap-3 overflow-hidden w-full">
            <a href="/login" class="inline-block transform translate-y-full clip-text drawer-btn w-1/2 text-center py-3.5 rounded-xl border border-[#111] text-[#111] font-sans text-[10px] font-bold tracking-widest uppercase hover:bg-[#111] hover:text-white sys-transition">Sign In</a>
            <a href="/register" class="inline-block transform translate-y-full clip-text drawer-btn w-1/2 text-center py-3.5 rounded-xl border border-[#111] text-[#111] font-sans text-[10px] font-bold tracking-widest uppercase hover:bg-[#111] hover:text-white sys-transition">Sign Up</a>
          </div>
          {% if ui_config.feature_flags.enable_partner_portal %}
          <div class="overflow-hidden w-full mt-1">
            <a href="/partner" class="inline-block transform translate-y-full clip-text drawer-btn w-full text-center py-4 rounded-xl bg-[#111] text-white font-sans text-[10px] font-bold tracking-widest uppercase hover:bg-[#C5A059] sys-transition">Partner Portal</a>
          </div>
          {% endif %}
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-[#111111] text-[#F5F5F0] relative z-50 pt-24 md:pt-40 overflow-hidden w-full border-t border-[#C5A059]/10">
  <div class="max-w-4xl mx-auto px-6 pb-12 text-center relative z-10 w-full">
    <div class="flex justify-center items-center mb-10">
      <img src="{{ ui_config.branding.logo_url }}" alt="Logo" class="w-12 h-12 object-contain invert opacity-60" loading="lazy">
    </div>
    <h2 class="text-4xl md:text-7xl font-serif italic mb-10 md:mb-16 tracking-wide text-white">Redefine your space.</h2>
    <div class="text-gray-500 text-[9px] md:text-[10px] font-sans flex flex-col sm:flex-row justify-between items-center gap-6 border-t border-gray-800 pt-10 uppercase tracking-[0.3em]">
      <p>&copy; {{ ui_config.footer.year }} {{ ui_config.branding.name }} Bathware.</p>
      <p>{{ ui_config.footer.text }}</p>
    </div>
  </div>
  <h1 class="absolute -bottom-4 md:-bottom-12 left-0 text-[20vw] md:text-[15vw] font-serif font-bold text-white/[0.02] leading-none pointer-events-none select-none text-center w-full">{{ ui_config.branding.name }}</h1>
</footer>

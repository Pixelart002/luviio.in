<div id="toastContainer" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

<script>
  window.showToast = function(message, isError = false) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    const bgColor = isError ? 'bg-red-900/90' : 'bg-[#121212]/95';
    const borderColor = isError ? 'border-red-500/50' : 'border-[#C5A059]/30';
    const textColor = isError ? 'text-white' : 'text-[#C5A059]';
    const icon = isError ? 'ri-error-warning-line' : 'ri-check-double-line';
    
    toast.className = `flex items-center gap-3 px-6 py-3.5 rounded-full backdrop-blur-md border ${bgColor} ${borderColor} shadow-[0_10px_40px_rgba(0,0,0,0.5)] transform translate-y-10 opacity-0 transition-all duration-500`;
    toast.innerHTML = `<i class="${icon} ${textColor} text-lg"></i><span class="text-white font-sans text-[10px] font-bold tracking-widest uppercase">${message}</span>`;
    
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
    setTimeout(() => {
      toast.classList.add('translate-y-10', 'opacity-0');
      setTimeout(() => toast.remove(), 500);
    }, 3000);
  }
</script>

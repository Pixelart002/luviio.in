{% extends "base.html" %}

{% block title %}Sign In - {{ ui_config.branding.name }}{% endblock %}

{% block extra_css %}
<style>
    body { background-color: #0a0a0a !important; color: #ffffff; overflow: hidden !important; height: 100dvh; }
    .input-group { position: relative; margin-bottom: 2.5rem; }
    .input-group input { width: 100%; padding: 8px 0; font-size: 0.875rem; color: #fff; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.15); outline: none; transition: border-color 0.3s; }
    .input-group input:focus { border-bottom: 1px solid #C5A059; }
    .input-group label { position: absolute; top: 8px; left: 0; font-size: 0.65rem; color: rgba(255,255,255,0.6); pointer-events: none; transition: 0.3s ease all; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }
    .input-group input:focus ~ label, .input-group input:valid ~ label { top: -16px; font-size: 0.55rem; color: #C5A059; }
</style>
{% endblock %}

{% block content %}
<main id="mainContent" class="opacity-0 hidden flex h-[100dvh] w-full bg-[#0a0a0a]">

    <div class="hidden md:flex md:w-1/2 h-full relative overflow-hidden bg-black">
        <img src="https://images.unsplash.com/photo-1620626011761-996317b8d101?auto=format&fit=crop&q=80&w=1200" id="authImage" class="absolute inset-0 w-full h-full object-cover opacity-60 scale-[1.2] gpu-target" alt="Luxury">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-[#0a0a0a]/30"></div>
        <div class="absolute bottom-16 left-16 z-10 auth-anim opacity-0 translate-y-8">
            <h2 class="text-5xl font-serif mb-4 text-white leading-tight">Curated for<br><span class="italic text-[#C5A059]">Eternity.</span></h2>
        </div>
    </div>

    <div class="w-full md:w-1/2 h-full flex flex-col justify-center items-center px-8 sm:px-16 lg:px-24 bg-[#0a0a0a] relative">
        <a href="/" class="absolute top-8 left-8 text-gray-400 hover:text-white sys-transition flex items-center gap-2 text-[10px] uppercase tracking-widest font-bold z-10 auth-anim opacity-0">
            <i class="ri-arrow-left-line text-sm"></i> Home
        </a>

        <div class="w-full max-w-[320px]">
            <div class="flex justify-center mb-8 auth-anim opacity-0 -translate-y-4">
                <img src="{{ ui_config.branding.logo_url }}" alt="Logo" class="w-14 h-14 object-contain invert opacity-90">
            </div>

            <form action="/login" method="POST" class="w-full">
                <div class="input-group auth-anim opacity-0 translate-y-4">
                    <input type="email" name="email" id="email" required>
                    <label for="email">Email Address</label>
                </div>
                <div class="input-group auth-anim opacity-0 translate-y-4 mb-6">
                    <input type="password" name="password" id="password" required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="w-full py-3.5 bg-[#C5A059] text-black rounded-sm font-bold uppercase tracking-[0.15em] text-[9px] hover:bg-white sys-transition auth-anim opacity-0 translate-y-4">
                    Secure Sign In
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
    window.initPageAnimations = function() {
        gsap.to("#authImage", { scale: 1, duration: 10, ease: "power1.out" });
        gsap.to(".auth-anim", { y: 0, opacity: 1, duration: 1, stagger: 0.08, ease: "power3.out", delay: 0.2 });
    };
</script>
{% endblock %}

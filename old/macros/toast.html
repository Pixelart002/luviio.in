{% macro render_toast() %}
<div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-sm shadow-2xl z-[100] flex items-center gap-3 font-sans text-[10px] uppercase tracking-widest font-bold sys-transition opacity-0 pointer-events-none translate-y-[-20px]">
  <i id="toastIcon" class="text-lg"></i>
  <span id="toastMsg"></span>
</div>

<script>
  // 1. GLOBAL FUNCTION (Taki koi bhi page aur button isko call kar sake)
  window.showToast = function(message, isError) {
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastMsg = document.getElementById('toastMsg');
    
    if (!toast) return;
    
    toastMsg.innerText = message;
    if (isError) {
      toast.classList.add('bg-red-900', 'text-white', 'border', 'border-red-700');
      toast.classList.remove('bg-luviio-gold', 'text-black');
      toastIcon.className = 'ri-error-warning-line text-lg';
    } else {
      toast.classList.add('bg-luviio-gold', 'text-black');
      toast.classList.remove('bg-red-900', 'text-white', 'border', 'border-red-700');
      toastIcon.className = 'ri-checkbox-circle-line text-lg';
    }
    
    // Animate In 
    toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
    
    // Hide after 4 seconds
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
    }, 4000);
  };
  
  // 2. URL PARSER (Sirf URL se error/msg nikalne ke liye)
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const msg = urlParams.get('msg');
    
    // Centralized Messages Dictionary
    const messages = {
      // Errors
      'invalid_password': { text: 'Incorrect Password. Try again.', error: true },
      'user_not_found': { text: 'No account found with this email.', error: true },
      'email_exists': { text: 'Email already registered. Please sign in.', error: true },
      'invalid_session': { text: 'Session expired. Please log in again.', error: true },
      'application_failed': { text: 'Could not submit application. Try again.', error: true },
      
      // Success
      'account_created': { text: 'Account created successfully! Please sign in.', error: false },
      'partner_application_received': { text: 'Application received! You can log in now.', error: false }
    };
    
    if (error && messages[error]) {
      window.showToast(messages[error].text, messages[error].error);
      window.history.replaceState({}, document.title, window.location.pathname); // Clean URL
    } else if (msg && messages[msg]) {
      window.showToast(messages[msg].text, messages[msg].error);
      window.history.replaceState({}, document.title, window.location.pathname); // Clean URL
    }
  });
</script>
{% endmacro %}

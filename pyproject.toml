[project]
name = "luviio-in"
version = "0.1.0"
description = "Luviio backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]==0.30.6",
  "supabase>=2.10.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart>=0.0.31",
  "stripe==10.12.0",
  "slowapi==0.1.9",
  "python-dotenv>=1.2.2",
  "httpx==0.27.2",
  "email-validator==2.2.0",
  "resend==2.4.0",
  "Pillow>=10.4.0",
  "pywebpush==2.0.0",
  "reportlab==4.2.2",
  "sentry-sdk>=2.8.0",
  "cachetools==5.5.0",
  "apscheduler",
  "nanoid",
  "qrcode>=7.4.2",
  "requests>=2.32.0,<3.0.0",
  "starlette>=1.3.1,<1.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy==1.13.0",
    "pip-audit==2.7.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
]

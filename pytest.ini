[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=30
pythonpath = .
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:supabase.*
    ignore::DeprecationWarning:reportlab.*
